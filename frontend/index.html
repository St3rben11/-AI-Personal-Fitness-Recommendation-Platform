<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Personal Fitness Recommendation Platform</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>AI Personal Fitness</h1>
        <p>Personalized Fitness Recommendation Platform</p>
    </header>

    <main>
        <section class="card">
            <h2>Your Fitness Profile</h2>

            <form id="fitnessForm">
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Enter your name" required>

                <label for="age">Age</label>
                <input type="number" id="age" placeholder="Enter your age" required>

                <label for="height">Height (cm)</label>
                <input type="number" id="height" placeholder="Enter your height" required>

                <label for="weight">Weight (kg)</label>
                <input type="number" id="weight" placeholder="Enter your weight" required>

                <label for="goal">Fitness Goal</label>
                <select id="goal">
                    <option value="weight-loss">Weight Loss</option>
                    <option value="muscle-gain">Muscle Gain</option>
                    <option value="maintenance">Weight Maintenance</option>
                </select>

                <label for="activity">Activity Level</label>
                <select id="activity">
                    <option value="low">Low</option>
                    <option value="moderate">Moderate</option>
                    <option value="high">High</option>
                </select>

                <button type="submit">Get Recommendation</button>
            </form>
        </section>

        <section class="card" id="results">
            <h2>Your Recommendation</h2>
            <p id="recommendation">
                Enter your information to receive a basic fitness recommendation.
            </p>

            <div id="calories"></div>
            <div id="macros"></div>
            <div id="workout"></div>
        </section>
    </main>

    <footer>
        <p>AI Personal Fitness Recommendation Platform — MVP</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
